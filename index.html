<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio Pessoal</title>

  <!-- Google Font (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Link para o CSS Externo -->
  <link rel="stylesheet" href="styles.css">

  <!-- Tag <style> no <head> -->
  <style>
    h2 {
      color: #2c3e50;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <!-- Estilo Inline no título <h1> -->
  <h1 style="color: #27ae60;">Antonio Erinaldo da Silva</h1>

  <!-- Div com a classe .bio -->
  <div class="bio">
    <!-- Atributo style no parágrafo -->
    <p style="font-size: 18px; color: #555555;">
      Olá! Sou um estudante de desenvolvimento web explorando conceitos de HTML5 e CSS. Apaixonado por tecnologia e design interativo.
    </p>
  </div>

  <h2>Minhas Habilidades</h2>

  <!-- Lista de habilidades -->
  <section>
    <ul>
      <li class="skill-dev">Desenvolvimento Web (HTML & CSS)</li>
      <li class="skill-design">Design de Interfaces (UI/UX)</li>
      <li class="skill-tools">Git & GitHub</li>
    </ul>
  </section>

</body>
</html>
